# SPI v2 板块轮动入场/出场策略参数
# Rotation Entry / Exit Strategy for SPI v2 Rotation System

name: rotation_entry
display_name: 板块轮动入场与出场
description: SPI v2 板块轮动入场（回踩均线）、出场（跌破/排名下滑）及观察池容量参数。
category: rotation
core_rules: [1, 2]
required_tools:
  - spi_calculator
  - constituents_snapshot
aliases: [轮动, 板块轮动, 入场出场]
default_active: true
default_priority: 5
market_regimes: [trending_up, ranging]

instructions: |
  **板块轮动入场与出场**

  本策略用于 SPI v2 板块轮动系统的入场、出场与观察池管理。

  判断标准：

  1. **入场（Entry）**
     - 成分股收盘价回踩至 EMA20（`entry.ema_period`）附近视为支撑位，容忍度为 `entry.pullback_tolerance`。
     - 量比大于 `entry.volume_ratio_threshold` 视为有效放量确认，才触发板块轮动 BUY 信号。

  2. **出场（Exit）**
     - 板块 SPI v2 排名跌出 Top `exit.top_m` 时，触发板块级出场信号。
     - 个股跌破 EMA `exit.ema_period` 时，触发个股级出场信号。

  3. **观察池（Watchpool）**
     - SPI v2 评分前 `watchpool.top_n` 的板块进入观察池。

  4. **日线补齐（Daily History）**
     - AlphaSift `sector_rotation` 实时选股时，若 `stock_daily` 缺失则先并行补齐成分股日线，并发度由 `daily_history.max_workers` 控制。

  数据依赖：
  - `spi_calculator`：计算板块 SPI 评分与排名。
  - `constituents_snapshot`：获取板块成分股快照。

entry:
  # 回踩均线周期（日），成分股收盘价回踩至此均线视为支撑位
  ema_period: 20
  # 量比阈值 — 量比 > 此值视为有效放量确认
  volume_ratio_threshold: 1.2
  # 回踩容忍度 — last_close <= EMA * (1 + tolerance) 即触发入场条件
  pullback_tolerance: 0.02

exit:
  # 板块 SPI v2 排名跌出 Top M 时触发板块级出场信号
  top_m: 50
  # 个股跌破此 EMA 周期时触发个股级出场信号
  ema_period: 5

watchpool:
  # 观察池容量 — v2_score 前 N 个板块进入观察池
  top_n: 1

daily_history:
  # AlphaSift sector_rotation 实时选股时，是否对缺失的 stock_daily 日线执行补齐
  enabled: true
  # 并行补齐粒度（线程数）；运行时会对缺失日线的成分股按此并发度调用 DataFetcherManager.get_daily_data
  max_workers: 10
